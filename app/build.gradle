plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Upload-key details live in keystore.properties (git-ignored, never commit). Without it, release builds are simply unsigned.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.plotfarms.voicecamera'
    compileSdk 36

    defaultConfig {
        applicationId "com.plotfarms.voicecamera"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'

    testImplementation 'junit:junit:4.13.2'
}
